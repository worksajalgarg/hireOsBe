openapi: 3.0.3
info:
  title: HireOS Platform API — Auth & RBAC
  version: 1.0.0
  description: Authentication, workspace, users, and roles endpoints under /api/v1.
servers:
  - url: http://localhost:4000/api/v1
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Email/password login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token issued; refresh token set as httpOnly cookie
  /auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token and issue new access token
      responses:
        "200":
          description: New access token
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Session revoked
  /auth/sso/callback:
    post:
      tags: [auth]
      summary: SSO stub callback (WorkOS/Auth0 deferred)
  /auth/forgot-password:
    post:
      tags: [auth]
      summary: Request password reset email (dev logs token)
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Reset password with token
  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: MFA verify stub (501 until TOTP)
  /auth/accept-invite:
    post:
      tags: [auth]
      summary: Accept tenant invitation and set password
  /users/me:
    get:
      tags: [users]
      security:
        - bearerAuth: []
      summary: Current user, tenant, profile, permissions
  /users/me/profile:
    patch:
      tags: [users]
      security:
        - bearerAuth: []
      summary: Update profile
  /users/me/change-password:
    post:
      tags: [users]
      security:
        - bearerAuth: []
      summary: Change password
  /workspace/settings:
    get:
      tags: [workspace]
      security:
        - bearerAuth: []
      summary: Workspace branding and policies
    patch:
      tags: [workspace]
      security:
        - bearerAuth: []
      summary: Update workspace settings (admin)
  /workspace/members:
    get:
      tags: [workspace]
      security:
        - bearerAuth: []
      summary: List members
  /workspace/members/invite:
    post:
      tags: [workspace]
      security:
        - bearerAuth: []
      summary: Invite member
  /workspace/members/{userId}/role:
    patch:
      tags: [workspace]
      security:
        - bearerAuth: []
      summary: Change member role
  /workspace/members/{userId}:
    delete:
      tags: [workspace]
      security:
        - bearerAuth: []
      summary: Remove member
  /roles:
    get:
      tags: [roles]
      security:
        - bearerAuth: []
      summary: Roles and permissions matrix
    post:
      tags: [roles]
      security:
        - bearerAuth: []
      summary: Create custom tenant role
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        tenantId:
          type: string
          format: uuid
