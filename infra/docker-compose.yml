# Local development only — no real AWS resources. Matches the reference
# architecture's data layer (PostgreSQL+pgvector, Redis, object storage)
# without provisioning cloud infrastructure (deferred per Sprint 1 decision).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"   # host 6380 -> container 6379; host already runs a native redis-server on 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform
      MINIO_ROOT_PASSWORD: platform123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqs:
    image: softwaremill/elasticmq-native:1.5.7
    ports:
      - "9324:9324"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 platform platform123 &&
      mc mb -p local/interview-recordings &&
      exit 0
      "

  # Not started by a plain `docker compose up -d` — only needed when running
  # LiveKit self-hosted locally. Currently LIVEKIT_URL points at LiveKit
  # Cloud (see platform/.env, ai-service/.env), so these stay opted-out by
  # default. To use them again: `docker compose --profile local-livekit up -d`
  # (and switch LIVEKIT_URL/API_KEY/API_SECRET back to the local values).
  livekit-server:
    image: livekit/livekit-server:latest
    profiles: ["local-livekit"]
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"   # signaling (HTTP/WS)
      - "7881:7881"   # RTC over TCP fallback
      - "50000-50100:50000-50100/udp"   # RTC media
    depends_on:
      redis:
        condition: service_healthy

  livekit-egress:
    image: livekit/egress:latest
    profiles: ["local-livekit"]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./livekit/egress.yaml:/etc/egress.yaml:ro
    depends_on:
      - livekit-server
      - minio-init

volumes:
  postgres-data:
  minio-data:
