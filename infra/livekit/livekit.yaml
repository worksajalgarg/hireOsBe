# Local development only — self-hosted LiveKit server.
# Swapping to LiveKit Cloud later is an env-var change (LIVEKIT_URL/API_KEY/API_SECRET)
# on the consuming services, not a change to this file or the app code.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
redis:
  address: redis:6379
keys:
  # devkey/devsecret — local dev only, matches LIVEKIT_API_KEY/LIVEKIT_API_SECRET
  # in platform/.env.example and ai-service/.env.example.
  devkey: hireosdevsecret_do_not_use_in_prod
